<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой статус | Cloud Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f0f7ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #5d4037; }
        
        .card { background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 500px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        h2 { color: #f06292; font-weight: 300; font-size: 24px; margin-bottom: 20px; }
        
        .timer-badge { font-size: 32px; font-weight: 700; color: #3b82f6; margin: 15px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Кнопка запуска таймера */
        .btn-start-timer { width: 100%; padding: 15px; background: #3b82f6; color: white; border: none; border-radius: 15px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: 0.2s; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); }
        .btn-start-timer:hover { background: #2563eb; transform: translateY(-2px); }

        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 5px; }
        .status-btn { padding: 16px; border: none; border-radius: 15px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .status-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        .btn-study { background: #28a745; }
        .btn-coffee { background: #ffc107; color: #333; }
        .btn-game { background: #17a2b8; }
        .btn-home { background: #6c757d; }

        .btn-google { background: #4285F4; color: white; width: 100%; padding: 14px; border: none; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .btn-logout { background: none; border: none; color: #888; text-decoration: underline; cursor: pointer; margin-top: 15px; font-size: 14px; }

        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #fff9fb; border-radius: 20px; margin-bottom: 10px; text-align: left; }
        .user-info { display: flex; align-items: center; }
        
        .status-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 15px; position: relative; background: #ccc; }
        .status-dot.online::after { content: ''; position: absolute; top: -3px; left: -3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #10b981; box-shadow: 0 0 8px #10b981; }
        
        .user-meta { text-align: right; font-size: 13px; }
        #myInfo { color: #ec407a; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
        
        .chat-box { background: #fff9fb; border-radius: 20px; height: 180px; overflow-y: auto; padding: 14px; text-align: left; margin-bottom: 12px; border: 1px solid #f3f4f6; font-size: 14px; }
        .chat-msg { margin-bottom: 8px; line-height: 1.4; }
        .chat-input-container { display: flex; gap: 8px; }
        .chat-input { flex: 1; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 15px; font-size: 14px; outline: none; background: #fff9fb; }
        .btn-send { background: #f06292; color: white; border: none; border-radius: 15px; width: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card" id="authCard">
        <h2>Авторизация</h2>
        <p style="color: #666; margin-bottom: 15px;">Войдите через Google, чтобы управлять своим статусом</p>
        <button class="btn-google" id="loginBtn">🌐 Войти через Google</button>
    </div>

    <div class="card hidden" id="profileCard">
        <h2>Мой профиль</h2>
        <div id="myInfo">Загрузка данных...</div>
        
        <div class="timer-badge">
            ⏱️ <span id="timerDisplay">00 сек.</span>
        </div>

        <button class="btn-start-timer" id="btnStartTimer">▶️ Запустить таймер</button>

        <div class="buttons-grid">
            <button class="status-btn btn-study" id="btnStudy">📚 Учусь</button>
            <button class="status-btn btn-coffee" id="btnCoffee">☕ Кофе</button>
            <button class="status-btn btn-game" id="btnGame">🎮 В игре</button>
            <button class="status-btn btn-home" id="btnHome">🏠 Дома</button>
        </div>
        <button class="btn-logout" id="logoutBtn">Выйти из аккаунта</button>
    </div>

    <div class="card">
        <h2>Монитор группы</h2>
        <div id="groupList">Загрузка списка участников...</div>
    </div>

    <div class="card">
        <h2>Общий чат</h2>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Сообщение...">
            <button class="btn-send" id="sendMsgBtn">➤</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://jntyxqszolfppwdrdipe.supabase.co';
        const KEY = 'sb_publishable_gDUijJdjrjuT-U8x3462qg_Nt1rZ2cD'; 
        const supabase = createClient(URL, KEY);

        let currentUserId = null;
        let timerInterval = null;
        let lastStartTimeISO = null; 
        let onlineUsers = {};
        let globalProfiles = [];

        // Авторизация Google
        document.getElementById('loginBtn').addEventListener('click', async () => {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: 'https://arina22-bit.github.io/arinka/' }
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        // НАЖАТИЕ НА КНОПКУ ТАЙМЕРА (Обновляет только время)
        async function startTimerOnly() {
            if (!currentUserId) return;
            const { error } = await supabase
                .from('profiles')
                .update({ session_start: new Date().toISOString() })
                .eq('id', currentUserId);

            if (error) console.error("Ошибка таймера:", error.message);
            else fetchGroup();
        }

        // НАЖАТИЕ НА КНОПКИ СТАТУСОВ (Меняет текст и цвет, НЕ сбрасывая таймер)
        async function changeStatus(statusText, colorCode) {
            if (!currentUserId) return;
            const { error } = await supabase
                .from('profiles')
                .update({ status: statusText, color: colorCode })
                .eq('id', currentUserId);

            if (error) console.error("Ошибка статуса:", error.message);
            else fetchGroup();
        }

        document.getElementById('btnStartTimer').addEventListener('click', startTimerOnly);
        document.getElementById('btnStudy').addEventListener('click', () => changeStatus('Учусь 📚', '#28a745'));
        document.getElementById('btnCoffee').addEventListener('click', () => changeStatus('Кофе ☕', '#ffc107'));
        document.getElementById('btnGame').addEventListener('click', () => changeStatus('В игре 🎮', '#17a2b8'));
        document.getElementById('btnHome').addEventListener('click', () => changeStatus('Дома 🏠', '#6c757d'));

        // Экранный счетчик
        function handleMyTimer(startTimeISO) {
            if (startTimeISO === lastStartTimeISO) return;
            lastStartTimeISO = startTimeISO;
            clearInterval(timerInterval);

            const display = document.getElementById('timerDisplay');
            if (!startTimeISO) { display.innerText = "00 сек."; return; }

            const start = new Date(startTimeISO).getTime();
            timerInterval = setInterval(() => {
                const diff = new Date().getTime() - start;
                if (diff < 0) return;
                const secs = Math.floor(diff / 1000) % 60;
                const mins = Math.floor(diff / (1000 * 60)) % 60;
                const hrs = Math.floor(diff / (1000 * 60 * 60));
                
                let text = `${secs} сек.`;
                if (mins > 0 || hrs > 0) text = `${mins}м ${secs}с`;
                if (hrs > 0) text = `${hrs}ч ${mins}м`;
                display.innerText = text;
            }, 1000);
        }

        function listenPresence(user) {
            const channel = supabase.channel('online_group', { config: { presence: { key: user.id } } });
            channel.on('presence', { event: 'sync' }, () => {
                onlineUsers = channel.presenceState();
                renderGroupList();
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') await channel.track({ online: true });
            });
        }

        async function fetchGroup() {
            const { data } = await supabase.from('profiles').select('*').order('username', { ascending: true });
            if (data) { globalProfiles = data; renderGroupList(); }
        }

        function renderGroupList() {
            const list = document.getElementById('groupList');
            if (!list) return;
            
            const sorted = [...globalProfiles].sort((a, b) => {
                return (onlineUsers[b.id] ? 1 : 0) - (onlineUsers[a.id] ? 1 : 0);
            });

            list.innerHTML = sorted.map(user => {
                const isOnline = onlineUsers[user.id] ? 'online' : '';
                let timeMeta = '0ч 0м 0с';
                if (user.session_start) {
                    const diff = new Date().getTime() - new Date(user.session_start).getTime();
                    if (diff > 0) {
                        const s = Math.floor(diff / 1000) % 60;
                        const m = Math.floor(diff / (1000 * 60)) % 60;
                        const h = Math.floor(diff / (1000 * 60 * 60));
                        timeMeta = `${h}ч ${m}м ${s}с`;
                    }
                }

                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="status-dot ${isOnline}" style="background: ${user.color || '#6c757d'}"></div>
                            <div>
                                <strong style="color: #4a4a4a; font-size: 15px;">${user.username || 'Аноним'}</strong><br>
                                <small style="color: #888; font-size: 12px;">${user.status || 'Нет статуса'}</small>
                            </div>
                        </div>
                        <div class="user-meta">
                            <span style="color:#2980b9; font-size:13px; font-weight:500;">⏱️ ${timeMeta}</span>
                        </div>
                    </div>
                `;
            }).join('');

            if (currentUserId) {
                const me = globalProfiles.find(u => u.id === currentUserId);
                if (me) {
                    document.getElementById('myInfo').innerText = `Привет, ${me.username}!`;
                    handleMyTimer(me.session_start);
                }
            }
        }

        // Чат
        async function fetchChat() {
            const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            if (data) {
                const box = document.getElementById('chatBox');
                box.innerHTML = data.map(m => `<div class="chat-msg"><strong style="color:#f06292;">${m.author}:</strong> ${m.text}</div>`).join('');
                box.scrollTop = box.scrollHeight;
            }
        }

        async function sendMsg() {
            const input = document.getElementById('chatInput');
            if (!input.value.trim() || !currentUserId) return;
            const myProfile = globalProfiles.find(u => u.id === currentUserId);
            await supabase.from('messages').insert({ author: myProfile ? myProfile.username : 'Аноним', text: input.value.trim() });
            input.value = '';
        }

        document.getElementById('sendMsgBtn').addEventListener('click', sendMsg);
        document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });

        supabase.auth.onAuthStateChange(async (event, session) => {
            const authCard = document.getElementById('authCard');
            const profileCard = document.getElementById('profileCard');

            if (session?.user) {
                currentUserId = session.user.id;
                authCard.classList.add('hidden');
                profileCard.classList.remove('hidden');

                const googleName = session.user.user_metadata.full_name || session.user.email.split('@')[0];
                
                // Проверяем, существует ли уже профиль, чтобы не перезаписывать пустые значения при обновлении страницы
                const { data: existing } = await supabase.from('profiles').select('id').eq('id', currentUserId).maybeSingle();
                if (!existing) {
                    await supabase.from('profiles').insert({ id: currentUserId, username: googleName, status: 'Дома 🏠', color: '#6c757d' });
                }

                listenPresence(session.user);
                fetchGroup();
                fetchChat();

                supabase.channel('room_updates')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => fetchGroup())
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => fetchChat())
                    .subscribe();
            } else {
                currentUserId = null;
                authCard.classList.remove('hidden');
                profileCard.classList.add('hidden');
                fetchGroup();
            }
        });

        setInterval(() => { if (currentUserId && globalProfiles.length > 0) renderGroupList(); }, 1000);
    </script>
</body>
</html>
