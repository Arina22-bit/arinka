<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой статус | Cloud Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f0f7ff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #5d4037; }
        
        .card { background: white; padding: 30px; border-radius: 30px; width: 100%; max-width: 500px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        
        h2 { color: #f06292; font-weight: 300; font-size: 24px; margin-bottom: 20px; }
        
        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        
        .status-btn { padding: 16px; border: none; border-radius: 15px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .status-btn:hover { opacity: 0.8; transform: translateY(-2px); }

        /* Твои новые цвета кнопок */
        .btn-study { background: #28a745; }
        .btn-coffee { background: #ffc107; color: #333; }
        .btn-game { background: #17a2b8; }
        .btn-home { background: #6c757d; }

        .user-item { display: flex; align-items: center; padding: 15px; background: #fff9fb; border-radius: 20px; margin-bottom: 10px; text-align: left; }
        .status-dot { width: 15px; height: 15px; border-radius: 50%; margin-right: 15px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        
        #myInfo { color: #ec407a; font-weight: bold; margin-bottom: 15px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Мой профиль</h2>
        <div id="myInfo">Загрузка данных...</div>
        <div class="buttons-grid">
            <button class="status-btn btn-study" onclick="changeStatus('Учусь', '#28a745')">📚 Учусь</button>
            <button class="status-btn btn-coffee" onclick="changeStatus('Кофе', '#ffc107')">☕ Кофе</button>
            <button class="status-btn btn-game" onclick="changeStatus('В игре', '#17a2b8')">🎮 В игре</button>
            <button class="status-btn btn-home" onclick="changeStatus('Дома', '#6c757d')">🏠 Дома</button>
        </div>
    </div>

    <div class="card">
        <h2>Монитор группы</h2>
        <div id="groupList">Загрузка списка участников...</div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // ДАННЫЕ ИЗ ТВОИХ СКРИНШОТОВ
        const URL = 'https://jntyxqszolfppwdrdipe.supabase.co';
        const KEY = 'sb_publishable_gDUijJdjrjuT-U8x3462qg_Nt1rZ2cD';
        const supabase = createClient(URL, KEY);

        // ТВОЙ ID
        const MY_ID = 'b7763f35-8511-4368-afb8-e0fe703c550b';

        window.changeStatus = async (statusText, colorCode) => {
            const { error } = await supabase
                .from('profiles')
                .update({ 
                    status: statusText, 
                    color: colorCode 
                })
                .eq('id', MY_ID);

            if (error) {
                alert("Ошибка! Проверь RLS политики.");
                console.error(error);
            } else {
                fetchGroup();
            }
        };

        async function fetchGroup() {
            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .order('username', { ascending: true });

            if (error) return console.error(error);

            const list = document.getElementById('groupList');
            list.innerHTML = data.map(user => `
                <div class="user-item">
                    <div class="status-dot" style="background: ${user.color || '#ccc'}"></div>
                    <div>
                        <strong style="color: #f06292;">${user.username}</strong><br>
                        <small style="color: #888;">${user.status || 'Статус не задан'}</small>
                    </div>
                </div>
            `).join('');

            const me = data.find(u => u.id === MY_ID);
            if (me) {
                document.getElementById('myInfo').innerText = `Привет, ${me.username}!`;
            }
        }

        fetchGroup();
        setInterval(fetchGroup, 5000);
    </script>
</body>
</html>
