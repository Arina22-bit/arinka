<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>BaaS + мгновенное обновление</title>
<style>
body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
.container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
button#mainBtn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; transition: 0.3s; }
button#mainBtn:hover { background: #0056b3; }
.post { background: #fff; border: 1px solid #eaeaea; padding: 15px; margin-top: 15px; border-radius: 8px; width: 100%; max-width: 500px; position: relative; }
.like-btn, .action-btn { cursor: pointer; border: none; background: #f8f9fa; padding: 5px 12px; border-radius: 20px; font-size: 14px; margin-right: 5px; transition: 0.2s; }
.like-btn:hover, .action-btn:hover { background: #e2e6ea; }
.time { font-size: 11px; color: #999; float: right; }
.likes-count { font-size: 13px; font-weight: 600; margin-left: 5px; color: #333; }
</style>
</head>
<body>

<div class="container">
<h3>Панель управления данными</h3>
<input type="text" id="name" placeholder="Имя профиля">
<input type="email" id="email" placeholder="Рабочий Email">
<button id="mainBtn">Опубликовать в облако</button>
</div>

<div id="feed" style="width: 100%; max-width: 500px;"></div>

<!-- Подключаем Firebase через классические скрипты -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script>
// Конфиг Firebase
const firebaseConfig = {
    apiKey: "AIzaSyBZBgQ_1ybnwRExd-5NUrRq50p1Q9DCB0Y",
    authDomain: "arina-po-243.firebaseapp.com",
    projectId: "arina-po-243",
    storageBucket: "arina-po-243.firebasestorage.app",
    messagingSenderId: "99660155983",
    appId: "1:99660155983:web:2ff92e8e1cfde2b06dee3a",
    measurementId: "G-KHJVKLKDX2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Добавление записи
document.getElementById('mainBtn').onclick = async function() {
    const btn = this;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    if (!name || !email) { alert("Заполните все поля!"); return; }
    btn.disabled = true;
    try {
        await db.collection("requests").add({
            name,
            email,
            likes: 0,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('name').value = "";
        document.getElementById('email').value = "";
    } catch(e) { alert("Ошибка: " + e.message); }
    btn.disabled = false;
};

// Увеличение лайка мгновенно
function processLike(id, likesSpan) {
    const docRef = db.collection("requests").doc(id);
    docRef.update({ likes: firebase.firestore.FieldValue.increment(1) });
    likesSpan.textContent = parseInt(likesSpan.textContent || 0) + 1;
}

// Редактирование записи мгновенно
function updateRequest(id, nameEl, emailEl) {
    const newName = prompt("Новое имя:", nameEl.textContent);
    const newEmail = prompt("Новый email:", emailEl.textContent);
    if (!newName && !newEmail) return;
    const docRef = db.collection("requests").doc(id);
    const fields = {};
    if (newName) fields.name = newName;
    if (newEmail) fields.email = newEmail;
    docRef.update(fields);
    if (newName) nameEl.textContent = newName;
    if (newEmail) emailEl.textContent = newEmail;
}

// Удаление записи мгновенно
function deleteRequest(id, postDiv) {
    if (!confirm("Удалить эту запись?")) return;
    db.collection("requests").doc(id).delete();
    postDiv.remove();
}

// Отображение данных
function renderFeed(snapshot) {
    const feed = document.getElementById('feed');
    feed.innerHTML = "";
    snapshot.forEach(doc => {
        const data = doc.data();
        const postDiv = document.createElement("div");
        postDiv.className = "post";
        postDiv.innerHTML = `
            <span class="time">${data.timestamp ? data.timestamp.toDate().toLocaleTimeString() : '...'}</span>
            <b class="name">${data.name}</b>
            <p class="email" style="margin: 5px 0;">${data.email}</p>
            <div style="display: flex; align-items: center;">
                <button class="like-btn">👍</button>
                <span class="likes-count">${data.likes || 0}</span>
                <button class="action-btn">✏️ Изменить</button>
                <button class="action-btn">🗑️ Удалить</button>
            </div>
        `;
        const likeBtn = postDiv.querySelector(".like-btn");
        const likesSpan = postDiv.querySelector(".likes-count");
        const nameEl = postDiv.querySelector(".name");
        const emailEl = postDiv.querySelector(".email");
        const editBtn = postDiv.querySelector(".action-btn:nth-of-type(1)");
        const deleteBtn = postDiv.querySelector(".action-btn:nth-of-type(2)");

        likeBtn.onclick = () => processLike(doc.id, likesSpan);
        editBtn.onclick = () => updateRequest(doc.id, nameEl, emailEl);
        deleteBtn.onclick = () => deleteRequest(doc.id, postDiv);

        feed.appendChild(postDiv);
    });
}

// Подписка на обновления Firestore
db.collection("requests").orderBy("timestamp", "desc").onSnapshot(renderFeed);
</script>

</body>
</html>
